<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ritika Kumari — Portfolio</title>

    <!-- Lottie web component (used for animated sparkle on the "P") -->
    <script
      src="https://unpkg.com/@lottiefiles/dotlottie-wc@0.9.10/dist/dotlottie-wc.js"
      type="module"
    ></script>

    <style>
      @import url("https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Caveat:wght@700&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,700;1,300&display=swap");

      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --lime: #d000ff;
        --lime-dim: rgba(208, 0, 255, 0.15);
        --bg: #0a0b0c;
        --s1: #111315;
        --s2: #16181a;
        --text: #f0f0ec;
        --muted: #888;
        --border: rgba(255, 255, 255, 0.07);
        --ease: cubic-bezier(0.16, 1, 0.3, 1);
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        background: var(--bg);
        color: var(--text);
        font-family: "DM Sans", sans-serif;
        overflow-x: hidden;
      }

      /* ---------- Hero title: animated P overlay (Lottie + purple sparkles) ---------- */
      .p-wrap {
        position: relative;
        display: inline-block;
        line-height: 1;
        isolation: isolate;
      }

      .p-wrap .p-letter {
        position: relative;
        z-index: 2;
        display: inline-block;
      }

      .p-wrap .p-lottie {
        position: absolute;
        z-index: 3;
        width: 110px;
        height: 110px;
        left: 56%;
        top: 34%;
        transform: translate(-50%, -50%);
        pointer-events: none;
        mix-blend-mode: screen;
        opacity: 0.95;
        filter: drop-shadow(0 0 18px rgba(208, 0, 255, 0.35));
        animation: pFloaty 2.6s ease-in-out infinite;
      }

      @keyframes pFloaty {
        0%,
        100% {
          transform: translate(-50%, -50%) rotate(-3deg) scale(1);
        }
        50% {
          transform: translate(-50%, -58%) rotate(3deg) scale(1.05);
        }
      }

      .p-wrap .sparkle-layer {
        position: absolute;
        inset: -26px;
        z-index: 4;
        pointer-events: none;
      }

      .p-wrap .sparkle-layer::before,
      .p-wrap .sparkle-layer::after {
        content: "";
        position: absolute;
        inset: 0;
        background:
          radial-gradient(circle, rgba(168, 85, 247, 0.95) 0 2px, transparent 3px)
            10% 30%/80px 80px,
          radial-gradient(circle, rgba(192, 132, 252, 0.9) 0 1.6px, transparent 3px)
            70% 20%/90px 90px,
          radial-gradient(circle, rgba(147, 51, 234, 0.9) 0 1.8px, transparent 3px)
            40% 80%/70px 70px,
          radial-gradient(circle, rgba(216, 180, 254, 0.85) 0 1.4px, transparent 3px)
            85% 75%/100px 100px;
        opacity: 0.75;
        filter: blur(0.1px);
        animation: sparkleUp 1.8s linear infinite;
      }

      .p-wrap .sparkle-layer::after {
        opacity: 0.55;
        animation-duration: 2.35s;
        animation-delay: -0.7s;
        transform: scale(1.06);
      }

      @keyframes sparkleUp {
        0% {
          transform: translate3d(0, 6px, 0);
          opacity: 0.15;
        }
        30% {
          opacity: 1;
        }
        100% {
          transform: translate3d(0, -10px, 0);
          opacity: 0.15;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .p-wrap .p-lottie {
          animation: none;
        }
        .p-wrap .sparkle-layer::before,
        .p-wrap .sparkle-layer::after {
          animation: none;
        }
      }

      canvas#sc {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 1;
      }

      #cur,
      #cur-ring {
        position: fixed;
        top: 0;
        left: 0;
        pointer-events: none;
        z-index: 9999;
        border-radius: 50%;
      }
      #cur {
        width: 10px;
        height: 10px;
        background: var(--lime);
        mix-blend-mode: difference;
        transition: transform 0.12s;
      }
      #cur-ring {
        width: 32px;
        height: 32px;
        border: 1.5px solid rgba(208, 0, 255, 0.45);
        transition:
          transform 0.35s var(--ease),
          width 0.25s,
          height 0.25s;
      }

      @media (pointer: coarse) {
        #cur,
        #cur-ring {
          display: none;
        }
      }

      nav {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 1.2rem 2rem;
        z-index: 200;
        transition:
          background 0.4s,
          backdrop-filter 0.4s,
          border-bottom 0.4s;
      }
      nav.scrolled {
        background: rgba(10, 11, 12, 0.92);
        backdrop-filter: blur(20px);
        border-bottom: 1px solid var(--border);
      }
      .nav-logo {
        font-family: "Bebas Neue", sans-serif;
        font-size: 1.5rem;
        letter-spacing: 0.1em;
        color: var(--lime);
      }
      .nav-links {
        display: flex;
        gap: 2rem;
        list-style: none;
      }
      .nav-links a {
        color: var(--muted);
        text-decoration: none;
        font-size: 0.8rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        transition: color 0.3s;
      }
      .nav-links a:hover {
        color: var(--lime);
      }

      .ham {
        display: none;
        flex-direction: column;
        gap: 5px;
        background: none;
        border: none;
        cursor: pointer;
        padding: 4px;
      }
      .ham span {
        display: block;
        width: 22px;
        height: 1.5px;
        background: var(--text);
        transition: all 0.35s var(--ease);
      }
      .ham.open span:nth-child(1) {
        transform: translateY(6.5px) rotate(45deg);
      }
      .ham.open span:nth-child(2) {
        opacity: 0;
        transform: scaleX(0);
      }
      .ham.open span:nth-child(3) {
        transform: translateY(-6.5px) rotate(-45deg);
      }

      .mobile-menu {
        display: none;
        position: fixed;
        inset: 0;
        top: 0;
        background: rgba(10, 11, 12, 0.97);
        backdrop-filter: blur(24px);
        z-index: 190;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2.5rem;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.4s var(--ease);
      }
      .mobile-menu.open {
        opacity: 1;
        pointer-events: all;
      }
      .mobile-menu a {
        font-family: "Bebas Neue", sans-serif;
        font-size: 3rem;
        letter-spacing: 0.1em;
        color: var(--text);
        text-decoration: none;
        transition:
          color 0.3s,
          transform 0.3s;
        display: block;
      }
      .mobile-menu a:hover {
        color: var(--lime);
        transform: translateX(8px);
      }

      @media (max-width: 768px) {
        .nav-links {
          display: none;
        }
        .ham {
          display: flex;
        }
        .mobile-menu {
          display: flex;
        }
      }

      .hero {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        position: relative;
        overflow: hidden;
        padding: 0 1.5rem;
      }
      .hero-bg {
        position: absolute;
        inset: 0;
        background: radial-gradient(
          ellipse 80% 60% at 50% 40%,
          #2d0d4a 0%,
          #0a0b0c 60%
        );
      }
      .hero-grid {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgba(208, 0, 255, 0.04) 1px, transparent 1px),
          linear-gradient(90deg, rgba(208, 0, 255, 0.04) 1px, transparent 1px);
        background-size: 50px 50px;
        mask-image: radial-gradient(
          ellipse 70% 60% at center,
          black 20%,
          transparent 80%
        );
        -webkit-mask-image: radial-gradient(
          ellipse 70% 60% at center,
          black 20%,
          transparent 80%
        );
      }
      .orb {
        position: absolute;
        border-radius: 50%;
        filter: blur(80px);
        pointer-events: none;
        z-index: 1;
      }
      .orb1 {
        width: 400px;
        height: 400px;
        background: rgba(208, 0, 255, 0.06);
        top: -100px;
        left: -100px;
        animation: orbFloat 8s ease-in-out infinite;
      }
      .orb2 {
        width: 300px;
        height: 300px;
        background: rgba(180, 0, 255, 0.05);
        bottom: 0;
        right: -80px;
        animation: orbFloat 10s 2s ease-in-out infinite reverse;
      }

      .hero-eyebrow {
        font-size: 0.72rem;
        letter-spacing: 0.35em;
        text-transform: uppercase;
        color: var(--lime);
        position: relative;
        z-index: 2;
        opacity: 0;
        animation: fadeUp 1s 0.3s var(--ease) forwards;
      }
      .hero-title {
        font-family: "Bebas Neue", sans-serif;
        font-size: clamp(5rem, 22vw, 14rem);
        line-height: 0.9;
        letter-spacing: -0.01em;
        position: relative;
        z-index: 2;
        background: linear-gradient(175deg, #fff 30%, #555 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        opacity: 0;
        animation: fadeUp 1.2s 0.1s var(--ease) forwards;
        margin: 0.2em 0 0.1em;
      }
      .hero-sig {
        font-family: "Caveat", cursive;
        font-size: clamp(1.8rem, 6vw, 3.5rem);
        color: var(--lime);
        filter: drop-shadow(0 0 20px rgba(208, 0, 255, 0.4));
        position: relative;
        z-index: 2;
        opacity: 0;
        animation: sigPop 1.5s 1s cubic-bezier(0.34, 1.56, 0.64, 1)
          forwards;
      }
      .hero-scroll {
        position: absolute;
        bottom: 2rem;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.4rem;
        font-size: 0.65rem;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--muted);
        z-index: 2;
        opacity: 0;
        animation: fadeIn 2s 2s forwards;
      }
      .scroll-line {
        width: 1px;
        height: 40px;
        background: linear-gradient(to bottom, transparent, var(--lime));
        animation: scrollPulse 2s ease infinite;
      }

      .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 0 1.5rem;
        position: relative;
        z-index: 2;
      }
      @media (max-width: 768px) {
        .container {
          padding: 0 1.2rem;
        }
      }

      section {
        padding: 6rem 0;
      }
      @media (max-width: 768px) {
        section {
          padding: 4rem 0;
        }
      }
      @media (max-width: 480px) {
        section {
          padding: 3rem 0;
        }
      }

      .sec-label {
        font-size: 0.7rem;
        letter-spacing: 0.38em;
        text-transform: uppercase;
        color: var(--lime);
        margin-bottom: 0.8rem;
        display: flex;
        align-items: center;
        gap: 0.8rem;
      }
      .sec-label::before {
        content: "";
        display: block;
        width: 1.6rem;
        height: 1px;
        background: var(--lime);
      }
      .sec-title {
        font-family: "Bebas Neue", sans-serif;
        font-size: clamp(3rem, 7vw, 7rem);
        line-height: 0.9;
        letter-spacing: 0.01em;
      }

      /* ... rest of your existing CSS remains unchanged ... */
    </style>
  </head>
  <body>
    <canvas id="sc"></canvas>
    <div id="cur"></div>
    <div id="cur-ring"></div>

    <!-- Mobile Menu Overlay -->
    <div class="mobile-menu" id="mm">
      <a href="#about" onclick="closeMM()">About</a>
      <a href="#logos" onclick="closeMM()">Logos</a>
      <a href="#branding" onclick="closeMM()">Branding</a>
      <a href="#uiux" onclick="closeMM()">UI/UX</a>
      <a href="#contact" onclick="closeMM()">Contact</a>
    </div>

    <!-- NAV -->
    <nav id="nav">
      <div class="nav-logo">RK</div>
      <ul class="nav-links">
        <li><a href="#about">About</a></li>
        <li><a href="#logos">Logos</a></li>
        <li><a href="#branding">Branding</a></li>
        <li><a href="#uiux">UI/UX</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
      <button class="ham" id="ham" aria-label="Open Menu">
        <span></span><span></span><span></span>
      </button>
    </nav>

    <!-- HERO -->
    <section class="hero">
      <div class="hero-bg"></div>
      <div class="hero-grid"></div>
      <div class="orb orb1"></div>
      <div class="orb orb2"></div>
      <p class="hero-eyebrow">Graphic Design &middot; Brand Identity &middot; UI/UX</p>

      <!-- Updated: Add lottie + sparkles on the letter "P" -->
      <h1 class="hero-title" aria-label="Portfolio">
        <span class="p-wrap" aria-hidden="true">
          <span class="p-letter">P</span>
          <dotlottie-wc
            class="p-lottie"
            src="https://lottie.host/ece9630a-12ff-45c8-9b18-bee99f72536b/hJMwSf3V0d.lottie"
            autoplay
            loop
          ></dotlottie-wc>
          <span class="sparkle-layer"></span>
        </span>
        <span aria-hidden="true">ortfolio</span>
      </h1>

      <div class="hero-sig">Ritika Kumari</div>
      <div class="hero-scroll">
        <div class="scroll-line"></div>
        <span>Scroll</span>
      </div>
    </section>

    <!-- ... rest of your existing HTML remains unchanged ... -->
  </body>
</html>
